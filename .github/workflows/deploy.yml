name: Deploy Database to Production

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  IMAGE_NAME: bus-enterprise-db
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ===========================================================================
  # Job 1: Validate SQL schema (runs on every PR + push)
  # ===========================================================================
  validate:
    name: Validate Schema SQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: bus_enterprise_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Install pg_partman in CI (build from source, same as Dockerfile)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y postgresql-server-dev-16 build-essential
          wget -q https://github.com/pgpartman/pg_partman/archive/refs/tags/v5.2.4.tar.gz -O /tmp/pg_partman.tar.gz
          mkdir -p /tmp/pg_partman
          tar -xzf /tmp/pg_partman.tar.gz -C /tmp/pg_partman --strip-components=1
          cd /tmp/pg_partman && make NO_BGW=0 && sudo make install

      - name: Run schema against test DB
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U postgres -d bus_enterprise_test \
            -f init-sql/01_schema.sql
        # This catches any SQL syntax errors, constraint definition issues,
        # or extension failures before they ever reach production.

      - name: Verify critical tables exist
        env:
          PGPASSWORD: ci_test_password
        run: |
          psql -h localhost -U postgres -d bus_enterprise_test -c "
            SELECT table_schema, table_name
            FROM information_schema.tables
            WHERE table_schema IN ('core','biz','fin','system')
            ORDER BY table_schema, table_name;
          "
          # Spot-check pg_partman registration
          psql -h localhost -U postgres -d bus_enterprise_test -c "
            SELECT parent_table, partition_interval FROM partman.part_config;
          "

  # ===========================================================================
  # Job 2: Build and push Docker image (only on main branch, after validate)
  # ===========================================================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # Job 3: Deploy to VPS (SSH, after build)
  # ===========================================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production   # GitHub environment protection rules apply here

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /opt/bus-enterprise-db

            # Pull latest compose file from repo (already checked out on VPS
            # via initial setup — see scripts/vps_initial_setup.sh)
            git pull origin master

            # Pull new image
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            # Rolling restart — zero downtime for the DB container
            # (takes the old container down, starts new one; Go backend
            # will reconnect automatically via its connection pool retry logic)
            IMAGE_TAG=${{ needs.build.outputs.image_tag }} \
              docker compose -f docker-compose.yml up -d --no-build bus_db

            # Confirm healthy
            sleep 10
            docker compose -f docker-compose.yml ps
            docker exec bus_enterprise_db pg_isready -U postgres -d bus_enterprise

            echo "Deploy complete: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"